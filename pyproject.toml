[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "mixing"
version = "0.0.88"
description = "Tools for video and audio editing"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
dependencies = [
    # Base install = the pure modules (srt, chapters, errors, util, egress,
    # transcript, dubbing TTS): no media backend, no bundled ffmpeg binary.
    # moviepy / opencv / scipy / pydub / burns live in the ``media`` extra.
    "config2py",
    "dol",
    "xdol",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/thorwhalen/mixing"

[project.optional-dependencies]
# The media backends: everything mixing.audio and mixing.video import.
# Importing either without this extra raises an ImportError naming it.
media = [
    "moviepy",
    # opencv-contrib-python (superset of opencv-python; MIT/Apache) is the single cv2 provider
    # across the ecosystem — mediapipe + syncnet require it, so using it here avoids the
    # unsupported double-install (both provide `cv2`) when muvid[scoring] is co-installed.
    "opencv-contrib-python",
    "pillow",
    "pydub",
    "numpy",
    # scipy backs mixing.audio's cross-correlation alignment (find_audio_offset /
    # find_audio_offset_detailed / align_clips_to_reference) and segmentation.
    "scipy",
    "burns",
    # The geometry VOCABULARY (SOCIAL_SIZES, the fit/fill/stretch mode names,
    # the social backdrop's blur sigma and dim factor) is owned by `looks` and
    # imported by mixing.video.video_util — one place says what a "shorts" is.
    # `looks` declares no dependencies of its own. The floor is the first
    # release carrying SOCIAL_SIZES / FitMode / DFLT_BACKDROP_*.
    "looks>=0.0.11",
]
testing = [
    "pytest",
    "mixing[media]",
]
clipboard = [
    "pyclip",
]
# An alias, kept because downstream projects install mixing[audio] (paces does,
# for mixing.audio and soundfile): the media backends plus soundfile. mixing
# imports nothing from it that media does not supply (soundfile is the widget's).
audio = [
    "mixing[media]",
    "soundfile",
]
# Array-only loudness (mixing.loudness): meters, level_group, limit_peaks. numpy +
# scipy only -- no media stack; the pyloudnorm meter is an optional extra install.
loudness = [
    "numpy",
    "scipy",
]
# Beat / downbeat / onset analysis (mixing.audio.beats: beat_grid, BeatGrid).
# librosa is ISC (commercial-clean) and lazy-imported, so `import mixing.audio`
# stays light.
beats = [
    "librosa",
]
# Pretrained models: the AudioSet tagger (AST) behind find_segments(strategy=
# "audioset") — tells sung songs from talk on radio shows. torch (BSD) and
# transformers (Apache-2.0) are lazy-imported inside the classifier, so
# `import mixing.audio` stays light; the model (MIT/ast-finetuned-audioset,
# BSD-3) downloads from the Hugging Face hub on first use.
ml = [
    "torch",
    "transformers",
]
# Speech/music separation (mixing.audio.separation: separate_speech, remove_talk).
# The runtime dependencies of the default strategy (MossFormer2-SE-48K via
# ClearVoice, Apache-2.0): exactly what the adapter's import path into
# clearvoice 0.1.2 imports. clearvoice itself is deliberately NOT listed: its own
# pins (numpy<2, librosa==0.10.2.post1, opencv-python==4.10.0.84, soundfile==0.12.1,
# scenedetect, ...) would downgrade numpy and add a second cv2 next to media's
# opencv-contrib-python. Install it on top, without its dependencies:
#   pip install 'mixing[separation]' && pip install --no-deps 'clearvoice==0.1.2'
# (exact pin: the adapter calls 0.1.2's internals). Names are spelled as their
# import names (pip normalises _ and -) so util.EXTRAS can mirror them.
separation = [
    "torch",
    "torchaudio",
    "huggingface_hub",
    "librosa",
    "soundfile",
    "einops",
    "rotary_embedding_torch",
    "yamlargparse",
    "tqdm",
    "torchinfo",
    "joblib",
]
# The "htdemucs" separation strategy (Demucs' vocals stem as speech; MIT):
# instrumental beds only, since it removes singing too.
demucs = [
    "demucs",
]
widget = [
    "ipywidgets",
    "soundfile",
    "jupyter",
]
gen = [
    "google-genai",
]
llm = [
    "aix",
]
dev = [
    "pytest",
    "ruff",
    "mixing[media]",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "mixing",
]
# EXACTLY what wads' run-tests action passes with `-o`, so a bare `pytest`
# runs what CI runs. NORMALIZE_WHITESPACE was here and is NOT there, so a
# doctest whose expected output was wrapped across lines passed locally and
# failed in CI — verified on this branch before the flags were aligned. No
# doctest in the package relies on it (checked: the suite is green either way).
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]
markers = [
    "slow: needs a model download / real media; skipped unless MIXING_RUN_SLOW=1",
]

[tool.wads.ops.ffmpeg]
description = "Multimedia framework for video/audio processing"
url = "https://ffmpeg.org/"
check.linux = "which ffmpeg"
check.macos = "which ffmpeg"
check.windows = "which ffmpeg"
install.linux = ["sudo apt-get update", "sudo apt-get install -y ffmpeg"]
install.macos = "brew install ffmpeg"
install.windows = "choco install ffmpeg -y --no-progress"

[tool.wads.ci]
project_name = "mixing"

# The suite exercises mixing.audio / mixing.video, which need the media backends.
[tool.wads.ci.install]
extras = "media"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
